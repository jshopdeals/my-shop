<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shop - Categories</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .category-card {
            background: white;
            width: 200px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .category-card:hover {
            transform: translateY(-5px);
        }
        .category-icon {
            font-size: 40px;
            margin-bottom: 10px;
            color: #6e48aa;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome to My Shop</h1>
        <p>Choose a category to explore products</p>
    </div>

    <div class="categories">
        <!-- ক্যাটাগরি ১ -->
        <div class="category-card" onclick="window.location='products.html?category=baby'">
            <div class="category-icon"><i class="fas fa-baby"></i></div>
            <h3>Baby Essentials</h3>
        </div>
        
        <!-- ক্যাটাগরি ২ -->
        <div class="category-card" onclick="window.location='products.html?category=women'">
            <div class="category-icon"><i class="fas fa-tshirt"></i></div>
            <h3>Women's Fashion</h3>
        </div>
        
        <!-- ক্যাটাগরি ৩ -->
        <div class="category-card" onclick="window.location='products.html?category=beauty'">
            <div class="category-icon"><i class="fas fa-magic"></i></div>
            <h3>Beauty Products</h3>
        </div>
        
        <!-- ক্যাটাগরি ৪ -->
        <div class="category-card" onclick="window.location='products.html?category=home'">
            <div class="category-icon"><i class="fas fa-home"></i></div>
            <h3>Home Decor</h3>
        </div>
        
        <!-- ক্যাটাগরি ৫ -->
        <div class="category-card" onclick="window.location='products.html?category=electronics'">
            <div class="category-icon"><i class="fas fa-laptop"></i></div>
            <h3>Electronics</h3>
        </div>
    </div>

    <script>
        // পরবর্তীতে ব্যবহৃত হবে
    </script>
</body>
</html>
